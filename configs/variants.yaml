# Hyperparameters transcribed verbatim from Boudraa et al. Table 2.
# NOTE: the paper's section 3.3 states the imgsz search space was {512, 640, 800},
# but Table 2 reports imgsz=416 for yolov10l and never reports 800. Table 2 wins,
# because Table 2 is what produced Table 3. This contradiction is flagged in the
# writeup as a paper defect, not silently "fixed".

defaults:                 # Config A  -- Ultralytics stock settings
  lr0: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  optimizer: SGD
  imgsz: 640
  batch: 16

common:
  epochs: 200
  patience: 30
  warmup_epochs: 3
  seed: 42
  cos_lr: false
  cache: ram
  workers: 2
  deterministic: true
  # Augmentation per section 3.4
  fliplr: 0.5
  flipud: 0.5
  mosaic: 1.0
  mixup: 0.1
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 15.0
  scale: 0.5
  perspective: 0.0005

# Table 2. est_min = my T4 wall-clock estimate assuming early stop near epoch 70-90.
# Use it for lane packing only; the paper's own Time column is non-monotonic in
# model size and therefore carries no information.
variants:
  yolov10n: {lr0: 8.165e-04, momentum: 0.7214, weight_decay: 0.007325,  optimizer: AdamW, imgsz: 640, batch: 8,  val_map50: 0.7541, est_min: 25}
  yolov10s: {lr0: 4.844e-03, momentum: 0.6548, weight_decay: 0.001440,  optimizer: SGD,   imgsz: 640, batch: 8,  val_map50: 0.8262, est_min: 30}
  yolov10m: {lr0: 1.200e-05, momentum: 0.6515, weight_decay: 3.227e-05, optimizer: AdamW, imgsz: 512, batch: 16, val_map50: 0.8282, est_min: 45}
  yolov10b: {lr0: 7.372e-05, momentum: 0.6657, weight_decay: 0.000686,  optimizer: Adam,  imgsz: 640, batch: 8,  val_map50: 0.8518, est_min: 65}
  yolov10l: {lr0: 6.751e-05, momentum: 0.6826, weight_decay: 0.000281,  optimizer: Adam,  imgsz: 416, batch: 16, val_map50: 0.8310, est_min: 70}
  yolov10x: {lr0: 2.178e-04, momentum: 0.6555, weight_decay: 0.000694,  optimizer: AdamW, imgsz: 512, batch: 4,  val_map50: 0.7818, est_min: 110}
  yolo11n:  {lr0: 3.508e-04, momentum: 0.8645, weight_decay: 2.089e-05, optimizer: AdamW, imgsz: 512, batch: 4,  val_map50: 0.7885, est_min: 22}
  yolo11s:  {lr0: 1.352e-04, momentum: 0.6451, weight_decay: 1.031e-05, optimizer: Adam,  imgsz: 512, batch: 16, val_map50: 0.8622, est_min: 25}
  yolo11m:  {lr0: 1.069e-04, momentum: 0.7743, weight_decay: 5.016e-06, optimizer: Adam,  imgsz: 640, batch: 16, val_map50: 0.8401, est_min: 45}
  yolo11l:  {lr0: 8.471e-03, momentum: 0.7070, weight_decay: 0.000190,  optimizer: SGD,   imgsz: 640, batch: 16, val_map50: 0.8414, est_min: 60}
  yolo11x:  {lr0: 2.667e-03, momentum: 0.8046, weight_decay: 0.000327,  optimizer: SGD,   imgsz: 640, batch: 4,  val_map50: 0.8209, est_min: 105}

